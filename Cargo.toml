[workspace]
resolver = "2"
members = [
    "crates/portage-core",
    "crates/portage-catalog",
    "crates/portage-auth",
    "crates/portage-providers",
    "crates/portage-media",
    "crates/portage-engine",
    "crates/portage-cli",
    "crates/portage-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lundgren-greg/portage-app"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
md-5 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
